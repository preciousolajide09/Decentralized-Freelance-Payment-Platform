# One-command local stack: PostgreSQL + backend API + frontend.
#
#   docker compose up --build
#
# Backend:  http://localhost:3000  (GET /health)
# Frontend: http://localhost:5173
#
# Every VITE_* value the frontend reads is optional here; set it in the shell or
# in a root `.env` file to bake it into the frontend image at build time, e.g.:
#   VITE_ESCROW_CONTRACT_ID=C... VITE_API_URL=https://api.example.com \
#     docker compose up --build
#
# The backend's contract ids default to the deployment committed in
# deployments/testnet.json, so the indexer runs in this stack out of the box.
# Override any of them (in the shell or a root `.env`) to point the stack at a
# different deployment after redeploying the contracts, e.g.:
#   ESCROW_CONTRACT_ID=C... DISPUTE_CONTRACT_ID=C... REPUTATION_CONTRACT_ID=C... \
#     docker compose up --build
#
# The full set is documented in README.md → Configuration → Frontend; testnet
# values live in deployments/testnet.json.
#
# Both service containers run as non-root (issue #112): the backend drops to
# the image's `node` user (uid 1000), the frontend uses nginx-unprivileged
# (uid 101), which is why the frontend listens on 8080 — a non-root process
# cannot bind port 80.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freelance_stellar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freelance_stellar"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      # Repo root: backend/Dockerfile copies deployments/testnet.json so the API
      # can detect stale contract ids at startup (issue #91).
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/freelance_stellar
      # Dev-only placeholder. Must be >= 32 chars (enforced by the config schema).
      JWT_SECRET: dev-only-insecure-secret-change-me-please
      STELLAR_NETWORK: testnet
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      # Contract ids the indexer subscribes to. Without them startIndexer()
      # logs "No contract IDs configured" and the stack never syncs chain
      # state (issue #42). The defaults are the testnet deployment recorded in
      # deployments/testnet.json; override them to follow a redeploy.
      ESCROW_CONTRACT_ID: ${ESCROW_CONTRACT_ID:-CALNRFGMUI7MLNLWO445U2BSDENF6DENURHXXFFRT6PV5GSOQX7GZGP7}
      DISPUTE_CONTRACT_ID: ${DISPUTE_CONTRACT_ID:-CB24TF5GPP7EA6VWK4KZWBHHSY6FWNV3DKOGSZSDK347EODGGNPN7IMF}
      REPUTATION_CONTRACT_ID: ${REPUTATION_CONTRACT_ID:-CA5GXR4LVH5DYGB2RZDFAM3VNJW6LQ5EKUKURSLZBJGAH7LFJAOHKSET}
      # SACs the escrow can pay in. The XLM SAC is fixed on testnet; USDC stays
      # empty until one is configured (see deployments/testnet.json).
      XLM_CONTRACT_ID: ${XLM_CONTRACT_ID:-CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC}
      USDC_CONTRACT_ID: ${USDC_CONTRACT_ID:-}
      INDEXER_POLL_INTERVAL_MS: 5000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Defaults to empty string so requests are relative (/api/...) and routed
        # through the frontend container's nginx reverse proxy to http://backend:3000
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_NETWORK: ${VITE_NETWORK:-testnet}
        VITE_ESCROW_CONTRACT_ID: ${VITE_ESCROW_CONTRACT_ID:-}
        VITE_DISPUTE_CONTRACT_ID: ${VITE_DISPUTE_CONTRACT_ID:-}
        VITE_REPUTATION_CONTRACT_ID: ${VITE_REPUTATION_CONTRACT_ID:-}
        VITE_USDC_CONTRACT_ID: ${VITE_USDC_CONTRACT_ID:-}
        # Enables the XLM payment option in the asset picker.
        VITE_XLM_CONTRACT_ID: ${VITE_XLM_CONTRACT_ID:-}
        # Optional: source account for public reads. Unset uses a built-in
        # secret-less key, so shared /jobs/:id links work without it.
        VITE_READONLY_SOURCE: ${VITE_READONLY_SOURCE:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Container listens on 8080 (unprivileged nginx); host side stays 5173.
      - "5173:8080"

  # Automated database backup service.
  #
  # Runs pg_dump on a schedule (default: every 24 hours) and writes compressed
  # SQL archives to the `postgres_backups` named volume. Each dump is timestamped
  # so the volume retains a rolling history; the BACKUP_RETAIN_DAYS variable
  # controls how many days of archives are kept (default: 7).
  #
  # Backups are written to /backups inside the container; mount a host path or
  # a separate cloud volume in production to persist them outside the host.
  #
  # To trigger a manual backup:
  #   docker compose exec db-backup /usr/local/bin/backup.sh
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: freelance_stellar
      # Interval between backups in seconds (default: 86400 = 24 hours).
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # Number of days of backup archives to retain before pruning.
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-7}
    volumes:
      - postgres_backups:/backups
    # The entrypoint writes a timestamped, gzip-compressed dump on first run and
    # then sleeps for BACKUP_INTERVAL_SECONDS before repeating.
    entrypoint: >
      /bin/sh -c '
        BACKUP_SCRIPT=/usr/local/bin/backup.sh
        cat > $$BACKUP_SCRIPT <<'"'"'EOF'"'"'
      #!/bin/sh
      set -e
      TIMESTAMP=$$(date +%Y%m%dT%H%M%S)
      DEST=/backups/freelance_stellar_$${TIMESTAMP}.sql.gz
      echo "[backup] Starting dump -> $$DEST"
      pg_dump --no-password -Fc | gzip > "$$DEST"
      echo "[backup] Dump complete: $$(du -sh $$DEST | cut -f1)"
      find /backups -name "*.sql.gz" -mtime +$${BACKUP_RETAIN_DAYS} -delete
      echo "[backup] Pruned archives older than $${BACKUP_RETAIN_DAYS} days"
      EOF
        chmod +x $$BACKUP_SCRIPT
        while true; do
          $$BACKUP_SCRIPT || echo "[backup] ERROR: dump failed, will retry next interval"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
      '

volumes:
  postgres_data:
  # Named volume for automated pg_dump archives produced by the db-backup service.
  # In production, replace this with a bind-mount to a cloud-backed path or a
  # managed volume so backups survive host replacement.
  postgres_backups:
